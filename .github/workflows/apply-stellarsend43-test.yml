name: Apply StellarSend 43 acceptance test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-stellarsend43-test.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out claimant branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: zz-sol/subscription-ttl-43

      - name: Apply acceptance test
        run: |
          git config user.name "tokenjunkielabs"
          git config user.email "brycembusiness2@gmail.com"
          echo '' | base64 -d > /tmp/stellarsend43_patch.py
          python /tmp/stellarsend43_patch.py
          git add stellar_send/src/test.rs
          git commit -m "test(stellar_send): cover yearly subscription TTL horizon"
          git push origin HEAD:refs/heads/zz-sol/subscription-ttl-43

      - name: Remove one-shot transport workflow
        if: always()
        run: |
          git config user.name "tokenjunkielabs"
          git config user.email "brycembusiness2@gmail.com"
          git fetch origin main
          git checkout -B main origin/main
          if [ -f .github/workflows/apply-stellarsend43-test.yml ]; then
            git rm .github/workflows/apply-stellarsend43-test.yml
            git commit -m "chore: remove StellarSend 43 one-shot transport"
            git push origin main
          fi
